<div class="fleet-page">
  <div class="fleet-topbar">
    <h2 class="fleet-title">Parc de machines</h2>
    <button class="fl-btn fl-btn-primary" (click)="goAdd()">+ Ajouter</button>
  </div>

  <div class="fleet-body">
    <div *ngIf="loading()" class="fleet-loading">Chargement…</div>

    <table *ngIf="!loading()" class="fl-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>N° Série</th>
          <th>Marque / Modèle</th>
          <th>Heures actuelles</th>
          <th>Statut</th>
          <th>Actif</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of machines()">
          <td><strong>{{ m.nom }}</strong></td>
          <td>{{ m.numeroSerie }}</td>
          <td>{{ m.marque }} {{ m.modele }}</td>
          <td>
            <button class="hours-chip" (click)="openHoursDialog(m)" title="Mettre à jour les heures">
              {{ m.heuresActuelles | number:'1.0-0' }} h
              <span class="hours-chip-icon">✎</span>
            </button>
          </td>
          <td>
            <span class="badge" [ngClass]="statutClass(m.statut)">{{ m.statut }}</span>
          </td>
          <td>
            <span class="badge" [ngClass]="m.actif ? 'badge--green' : 'badge--grey'">
              {{ m.actif ? 'Oui' : 'Non' }}
            </span>
          </td>
          <td class="fl-actions">
            <button class="fl-btn fl-btn-ghost" (click)="goEdit(m)" title="Modifier">✎</button>
            <button class="fl-btn fl-btn-ghost" (click)="goMaintenance(m)" title="Règles de maintenance">🔧</button>
            <button class="fl-btn fl-btn-ghost" (click)="goStatsSyage(m)" title="Statistiques de Syage">📊</button>

            <button class="fl-btn fl-btn-ghost" (click)="toggle(m)"
                    [title]="m.actif ? 'Désactiver' : 'Activer'">
              {{ m.actif ? '🔴' : '🟢' }}
            </button>
          </td>
        </tr>
        <tr *ngIf="machines().length === 0">
          <td colspan="7" class="fl-empty">Aucune machine enregistrée</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Panneau — Mettre à jour les heures -->
<app-update-machine-hours-dialog
  [open]="isHoursDialogOpen"
  [machine]="selectedMachine"
  (closed)="onHoursDialogClosed()"
  (updated)="onHoursUpdated()">
</app-update-machine-hours-dialog>
