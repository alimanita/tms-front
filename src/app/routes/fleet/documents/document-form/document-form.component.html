<div class="fleet-page">
  <div class="fleet-topbar">
    <h2 class="fleet-title">{{ isEdit ? 'Modifier Document' : 'Nouveau Document' }}</h2>
    <div class="fl-topbar-actions">
      <button class="fl-btn fl-btn-ghost" (click)="onCancel()" [disabled]="loading">← Retour</button>
      <button class="fl-btn fl-btn-primary" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </div>

  <div class="fleet-body">
    <form [formGroup]="form" class="fl-form">
      <div class="fl-grid">

        <div class="fl-field">
          <label>Type de document *</label>
          <select formControlName="typeDocument">
            <option *ngFor="let t of typeDocuments" [value]="t.value">{{ t.label }}</option>
          </select>
        </div>

        <div class="fl-field">
          <label>Numéro de référence</label>
          <input type="text" formControlName="referenceNumber">
        </div>

        <div class="fl-field">
          <label>Concerne (Entité) *</label>
          <select formControlName="entityType">
            <option value="VEHICLE">Véhicule</option>
            <option value="DRIVER">Chauffeur</option>
            <option value="COMPANY">Entreprise</option>
            <option value="PARTNER">Partenaire</option>
            <option value="OTHER">Autre</option>
          </select>
        </div>

        <div class="fl-field">
          <label>Choix de l'entité *</label>
          <select formControlName="entityId" [class.error]="submitted && form.get('entityId')?.invalid">
            <option [ngValue]="null">-- Sélectionner --</option>
            <ng-container *ngIf="entityType === 'VEHICLE'">
              <option *ngFor="let v of vehicules" [value]="v.id">{{ v.immatriculation }} ({{ v.marque }})</option>
            </ng-container>
            <ng-container *ngIf="entityType === 'DRIVER'">
              <option *ngFor="let c of chauffeurs" [value]="c.id">{{ c.nom }} {{ c.prenom }}</option>
            </ng-container>
            <ng-container *ngIf="entityType === 'PARTNER'">
              <option *ngFor="let p of partenaires" [value]="p.id">{{ p.nom }}</option>
            </ng-container>
            <!-- Entreprise et Autre : pas de sous-sélection (entityId optionnel) -->
          </select>
        </div>

        <div class="fl-field">
          <label>Date d'émission</label>
          <input type="date" formControlName="issueDate">
        </div>

        <div class="fl-field">
          <label>Date d'expiration</label>
          <input type="date" formControlName="expiryDate">
        </div>

        <div class="fl-field">
          <label>Émetteur (Assurance, Centre...)</label>
          <input type="text" formControlName="issuer">
        </div>

        <div class="fl-field">
          <label>Montant (Coût) €</label>
          <input type="number" formControlName="amount" step="0.01">
        </div>

        <div class="fl-field fl-field--full">
          <label>Fichier joint (Scan PDF/Image)</label>
          
          <div class="fl-upload-zone" 
               [class.has-file]="!!selectedFile"
               [class.drag-over]="isDragging"
               (dragover)="onDragOver($event)"
               (dragleave)="onDragLeave($event)"
               (drop)="onDrop($event)">
            <input type="file" id="proofFile" accept="image/*,.pdf" (change)="onFileChange($event)" hidden/>
            <input type="file" id="proofCamera" accept="image/*" capture="environment" (change)="onFileChange($event)" hidden/>
            
            <ng-container *ngIf="!selectedFile && !existingProofUrl">
              <div class="upload-actions">
                <label for="proofCamera" class="fl-btn camera-btn" title="Prendre une photo">
                  <mat-icon style="vertical-align: middle; margin-right: 4px;">photo_camera</mat-icon> Prendre une photo
                </label>
                <span class="upload-or">ou</span>
                <label for="proofFile" class="fl-btn fl-btn-ghost file-btn" title="Choisir un fichier">
                  <mat-icon style="vertical-align: middle; margin-right: 4px;">attach_file</mat-icon> Parcourir
                </label>
              </div>
              <div style="text-align: center; margin-top: 12px; font-size: 0.85rem; color: #6b7280;">
                Vous pouvez aussi <strong>glisser-déposer</strong> un fichier ici ou faire <strong>Ctrl+V</strong> pour coller une image (ex: depuis WhatsApp Web).
              </div>
            </ng-container>

            <span *ngIf="selectedFile" class="fl-file-name" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
              <span>{{ selectedFile.name }}</span>
              <button type="button" class="fl-file-remove" (click)="removeFile()" title="Supprimer">✕</button>
            </span>

            <span *ngIf="!selectedFile && existingProofUrl" class="fl-file-name" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
              <span>Justificatif existant <a [href]="existingProofUrl" target="_blank">Voir</a></span>
              <button type="button" class="fl-file-remove" (click)="existingProofUrl = null" title="Remplacer">✕</button>
            </span>
            
            <div *ngIf="selectedFile && !extracting" style="margin-top: 10px; width: 100%;">
              <button type="button" class="fl-btn fl-btn-primary" (click)="extractData()" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;">
                <mat-icon style="vertical-align: middle;">auto_awesome</mat-icon>
                Extraire avec l'IA
              </button>
            </div>
            
            <div *ngIf="extracting" class="extracting-indicator" style="margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; color: #3b82f6;">
               <mat-spinner diameter="20"></mat-spinner>
               <span>Extraction en cours...</span>
            </div>

          </div>
          
          <img *ngIf="previewUrl" [src]="previewUrl" alt="Aperçu" class="fl-preview-img"/>
        </div>

        <div class="fl-field fl-field--full">
          <label>Notes</label>
          <textarea formControlName="notes" rows="3" placeholder="Observations..."></textarea>
        </div>

      </div>
    </form>
  </div>
</div>
