<div class="panel-overlay" *ngIf="isOpen" (click)="onBackdropClick()">
  <div class="drawer" (click)="$event.stopPropagation()">

    <div class="drawer-header">
      <div class="drawer-header-left">
        <mat-icon>inventory_2</mat-icon>
        <h2>{{ isEdit ? 'Modifier la pièce' : 'Nouvelle pièce' }}</h2>
      </div>
      <button type="button" class="drawer-close" (click)="close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="drawer-body">
      <form [formGroup]="form" class="phase-section">

        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Référence </label>
            <input class="field-input" formControlName="reference" placeholder="Ex: HUILE-15W40"/>
          </div>
          <div class="field-group">
            <label class="field-label">Unité</label>
            <select class="field-input" formControlName="unit">
              <option *ngFor="let u of unitOptions" [value]="u">{{ u }}</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Désignation <span class="required">*</span></label>
          <input class="field-input" formControlName="name" placeholder="Ex: Huile moteur 15W40"/>
        </div>

        <div class="field-group">
          <label class="field-label">Marque</label>
          <input class="field-input" formControlName="brand" placeholder="Ex: Total, Bosch..."/>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Coût unitaire (dt)</label>
            <input class="field-input" type="number" step="0.001" min="0" formControlName="unitCost"/>
          </div>
          <div class="field-group">
            <label class="field-label">Emplacement</label>
            <input class="field-input" formControlName="location" placeholder="Ex: Rayon A3"/>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Stock actuel <span class="required">*</span></label>
            <input class="field-input" type="number" step="0.01" min="0" formControlName="stockQty"/>
          </div>
          <div class="field-group">
            <label class="field-label">Stock minimum <span class="required">*</span></label>
            <input class="field-input" type="number" step="0.01" min="0" formControlName="minStockQty"/>
          </div>
        </div>

        <div class="form-section-title" style="margin-top: 1rem; margin-bottom: 0.5rem; font-weight: 600;">TVA & Justificatif</div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Montant HT (dt)</label>
            <input class="field-input" type="number" step="0.001" min="0" formControlName="amountHT"/>
          </div>
          <div class="field-group">
            <label class="field-label">Taux TVA (%)</label>
            <input class="field-input" type="number" step="1" min="0" formControlName="tvaRate"/>
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Montant TVA (dt) - <i>Auto</i></label>
            <input class="field-input" type="number" step="0.001" formControlName="tvaAmount"/>
          </div>
          <div class="field-group">
            <label class="field-label" style="display: flex; align-items: center; gap: 0.5rem; height: 100%;">
              <input type="checkbox" formControlName="isTvaRecoverable" style="width: 1.2rem; height: 1.2rem;" />
              TVA Récupérable
            </label>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Justificatif (Facture, Ticket, Image)</label>
          <div class="file-upload-wrapper">
            <input type="file" id="pieceProof" (change)="onFileSelected($event)" accept="image/*,application/pdf" style="display: none" />
            <label for="pieceProof" class="btn-outline" style="cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center;">
              <mat-icon>upload_file</mat-icon>
              {{ selectedFileName || 'Choisir un fichier' }}
            </label>
            <button type="button" class="btn-primary" *ngIf="selectedFile && !loading" (click)="extractData()" style="margin-top: 0.5rem; width: 100%; display: flex; align-items: center; gap: 0.5rem; justify-content: center;">
              <mat-icon>auto_awesome</mat-icon> Extraire avec l'IA
            </button>
          </div>
        </div>

      </form>
    </div>

    <div class="drawer-footer">
      <button type="button" class="btn-outline" (click)="close()">Annuler</button>
      <button type="button" class="btn-primary" [disabled]="form.invalid || loading" (click)="onSubmit()">
        <mat-spinner *ngIf="loading" diameter="16" class="btn-spinner"></mat-spinner>
        <mat-icon *ngIf="!loading">check</mat-icon>
        <span>{{ isEdit ? 'Enregistrer' : 'Créer' }}</span>
      </button>
    </div>

  </div>
</div>
